name: Update Profile Art

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

concurrency:
  group: profile-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-heatmap:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Log configuration
        run: |
          echo "::group::Configuration summary"
          echo "Username: $(python -c "import yaml; print(yaml.safe_load(open('config.yaml'))['username'])")"
          echo "Schedule: 17 6 * * *"
          echo "Python: $(python --version)"
          echo "::endgroup::"

      - name: Fetch contribution data
        id: fetch
        run: |
          PYTHONPATH=. python scripts/fetch_contributions.py

      - name: Render contribution heatmap
        run: |
          PYTHONPATH=. python scripts/render_heatmap_svg.py

      - name: Validate generated SVG and data
        run: |
          PYTHONPATH=. python -c "
          import sys
          from scripts.utils import validate_svg, load_json

          if not validate_svg('contrib-heatmap.svg'):
              print('::error::Heatmap SVG validation failed')
              sys.exit(1)
          print('✓ Heatmap SVG validated')

          data = load_json('data/contributions.json')
          if data is None:
              print('::error::No contribution data found')
              sys.exit(1)
          for key in ['days', 'yearly_total', 'current_streak', 'longest_streak']:
              if key not in data:
                  print(f'::error::Missing key in contributions data: {key}')
                  sys.exit(1)
          print('✓ Contribution data validated')
          "

      - name: Generate README
        run: |
          PYTHONPATH=. python scripts/generate_readme.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add contrib-heatmap.svg data/contributions.json README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh profile assets [skip ci]"
            git pull --ff-only origin main 2>/dev/null || true
            git push origin main
            echo "Changes committed and pushed."
          fi

      - name: Workflow summary
        run: |
          echo "## Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Contributions fetched: \`success\`" >> $GITHUB_STEP_SUMMARY
          echo "- Heatmap rendered: \`contrib-heatmap.svg\`" >> $GITHUB_STEP_SUMMARY
          echo "- Validations passed" >> $GITHUB_STEP_SUMMARY
